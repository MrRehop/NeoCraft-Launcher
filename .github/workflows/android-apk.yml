name: Build NeoCraft Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract Stage 9 source archive
        run: unzip -q NeoCraft-NeoMod-Stage9-clean.zip -d .
      - name: Apply shared JSON parser resource limits
        run: |
          git apply --check patches/NeoModJson-resource-limits.patch
          git apply patches/NeoModJson-resource-limits.patch
      - name: Inspect extracted NeoMod source layout
        run: |
          echo "=== Kotlin source files ==="
          find NeoCraft -type f \( -name '*.kt' -o -name '*.kts' \) | sort
          echo "=== Module build files ==="
          find NeoCraft -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
          echo "=== NeoMod core build configuration ==="
          sed -n '1,240p' NeoCraft/neomod-core/build.gradle.kts
          echo "=== NeoMod core Kotlin declarations ==="
          grep -R -nE '^(package |(data )?class |(sealed )?(interface|class|object|enum class) )' NeoCraft/neomod-core/src 2>/dev/null || true
          for source in \
            NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NeoModModels.kt \
            NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NeoModJson.kt \
            NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NeoModValidator.kt \
            NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NeoModPackageReader.kt \
            NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NeoModPackageManager.kt \
            NeoCraft/neomod-core/src/test/kotlin/org/neocraft/neomod/core/NeoModCoreSelfTest.kt \
            NeoCraft/neomod-core/src/test/kotlin/org/neocraft/neomod/core/NeoModPackageReaderSelfTest.kt; do
            echo "=== SOURCE: $source ==="
            sed -n '1,320p' "$source"
          done
      - name: Apply Android module dependency fix
        run: cp patches/android-integration-build.gradle.kts NeoCraft/android-integration/build.gradle.kts
      - name: Apply reviewed build registry and launcher UI
        run: |
          mkdir -p NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core
          cp patches/ReviewedGameBuilds.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/ReviewedGameBuilds.kt
          cp patches/NcpManifest.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NcpManifest.kt
          mkdir -p NeoCraft/neomod-core/src/test/kotlin/org/neocraft/neomod/core
          cp patches/NcpManifestSelfTest.kt NeoCraft/neomod-core/src/test/kotlin/org/neocraft/neomod/core/NcpManifestSelfTest.kt
          cp patches/NcpPackageReader.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NcpPackageReader.kt
          cp patches/NcpZipMetadataGuard.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/NcpZipMetadataGuard.kt
          cp patches/NcpPackageReaderSelfTest.kt NeoCraft/neomod-core/src/test/kotlin/org/neocraft/neomod/core/NcpPackageReaderSelfTest.kt
          cp patches/AndroidGameDiscovery-artifact-digests.kt NeoCraft/android-integration/src/main/kotlin/org/neocraft/neomod/android/AndroidGameDiscovery.kt
          cp patches/MainActivity-diagnostics.kt NeoCraft/app/src/main/java/org/neocraft/launcher/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure NCP manifest self-test
        working-directory: NeoCraft
        run: |
          cat >> neomod-core/build.gradle.kts <<'EOF'
          tasks.register<JavaExec>("ncpManifestSelfTest") {
              dependsOn(tasks.testClasses)
              classpath = sourceSets["test"].runtimeClasspath
              mainClass.set("org.neocraft.neomod.core.NcpManifestSelfTestKt")
          }
          tasks.register<JavaExec>("ncpPackageReaderSelfTest") {
              dependsOn(tasks.testClasses)
              classpath = sourceSets["test"].runtimeClasspath
              mainClass.set("org.neocraft.neomod.core.NcpPackageReaderSelfTestKt")
          }
          EOF
      - name: Run NeoMod core self-tests
        working-directory: NeoCraft
        run: gradle --no-daemon :neomod-core:selfTest :neomod-core:ncpManifestSelfTest :neomod-core:ncpPackageReaderSelfTest
      - name: Build debug APK
        working-directory: NeoCraft
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neocraft-debug-apk
          path: NeoCraft/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
