name: Build NeoCraft Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract Stage 9 source archive
        run: unzip -q NeoCraft-NeoMod-Stage9-clean.zip -d .
      - name: Inspect extracted NeoMod source layout
        run: |
          echo "=== Kotlin source files ==="
          find NeoCraft -type f \( -name '*.kt' -o -name '*.kts' \) | sort
          echo "=== Module build files ==="
          find NeoCraft -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
          echo "=== NeoMod core build configuration ==="
          sed -n '1,240p' NeoCraft/neomod-core/build.gradle.kts
          echo "=== NeoMod core Kotlin declarations ==="
          grep -R -nE '^(package |(data )?class |(sealed )?(interface|class|object|enum class) )' NeoCraft/neomod-core/src 2>/dev/null || true
      - name: Apply Android module dependency fix
        run: cp patches/android-integration-build.gradle.kts NeoCraft/android-integration/build.gradle.kts
      - name: Apply reviewed build registry and launcher UI
        run: |
          mkdir -p NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core
          cp patches/ReviewedGameBuilds.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/ReviewedGameBuilds.kt
          cp patches/AndroidGameDiscovery-artifact-digests.kt NeoCraft/android-integration/src/main/kotlin/org/neocraft/neomod/android/AndroidGameDiscovery.kt
          cp patches/MainActivity-diagnostics.kt NeoCraft/app/src/main/java/org/neocraft/launcher/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: NeoCraft
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neocraft-debug-apk
          path: NeoCraft/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
