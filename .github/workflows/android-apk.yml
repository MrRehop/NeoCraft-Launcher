name: Build NeoCraft Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract Stage 9 source archive
        run: unzip -q NeoCraft-NeoMod-Stage9-clean.zip -d .
      - name: Apply Android module dependency fix
        run: cp patches/android-integration-build.gradle.kts NeoCraft/android-integration/build.gradle.kts
      - name: Apply reviewed build registry and launcher UI
        run: |
          mkdir -p NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core
          cp patches/ReviewedGameBuilds.kt NeoCraft/neomod-core/src/main/kotlin/org/neocraft/neomod/core/ReviewedGameBuilds.kt
          cp patches/MainActivity-diagnostics.kt NeoCraft/app/src/main/java/org/neocraft/launcher/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: NeoCraft
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neocraft-debug-apk
          path: NeoCraft/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
